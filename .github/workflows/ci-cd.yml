name: CI/CD - California Housing Model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_NAME: b2f79a6b7a564a19ab373ce9c22c2bc6   # ACR déjà existant, créé par Azure ML
  IMAGE_NAME: california-housing-scoring
  RESOURCE_GROUP: afenichamal
  WORKSPACE_NAME: ws-mlops-stage-amal
  ENDPOINT_NAME: california-housing-endpoint

jobs:
  # -----------------------------------------------------------------
  # Étape 1 : Tests CI (linting + tests unitaires) — sur runner GitHub classique
  # (pas besoin d'Azure ici, donc pas besoin du runner self-hosted)
  # -----------------------------------------------------------------
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installer les dépendances de dev
        run: pip install -r requirements-dev.txt

      - name: Linting (flake8)
        run: flake8 pipeline/ deployment/ tests/ --max-line-length=120 --extend-ignore=E402

      - name: Tests unitaires (pytest)
        run: pytest tests/ -v

  # -----------------------------------------------------------------
  # Étape 2 : Build de l'image Docker + Push vers Azure Container Registry
  # Exécuté sur le RUNNER SELF-HOSTED (instance de calcul Azure ML),
  # déjà authentifié via `az login` — pas besoin de secret Azure.
  # -----------------------------------------------------------------
  build-and-push:
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Définir le tag de l'image (SHA du commit)
        id: vars
        run: echo "image_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build de l'image Docker
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }} \
                       -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
                       ./deployment

      - name: Push de l'image vers ACR
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

  # -----------------------------------------------------------------
  # Étape 3 : Déploiement Champion + Challenger sur l'Azure Managed Online Endpoint
  # (A/B testing) — sur le runner self-hosted, pour la même raison d'authentification.
  # -----------------------------------------------------------------
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      # Évite le conflit de permissions sur le dossier système partagé
      # /opt/az/extensions (accessible en écriture uniquement par root).
      # Force Azure CLI à utiliser un dossier d'extensions propre à l'utilisateur.
      AZURE_EXTENSION_DIR: /home/azureuser/.azure/cliextensions
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Vérifier/installer l'extension Azure ML CLI
        run: az extension list -o table | grep -q '^ml ' || az extension add -n ml -y

      - name: Créer l'endpoint (si inexistant)
        run: |
          az ml online-endpoint show --name ${{ env.ENDPOINT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --workspace-name ${{ env.WORKSPACE_NAME }} || \
          az ml online-endpoint create --name ${{ env.ENDPOINT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --workspace-name ${{ env.WORKSPACE_NAME }} \
            --auth-mode key

      - name: Déployer le Champion (modèle v1, stable)
        run: |
          az ml online-deployment create \
            --file deployment/deployment_champion.yaml \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --workspace-name ${{ env.WORKSPACE_NAME }} \
            || az ml online-deployment update \
            --file deployment/deployment_champion.yaml \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --workspace-name ${{ env.WORKSPACE_NAME }}

      - name: Déployer le Challenger (modèle v2, issu du sweep)
        run: |
          az ml online-deployment create \
            --file deployment/deployment_challenger.yaml \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --workspace-name ${{ env.WORKSPACE_NAME }} \
            || az ml online-deployment update \
            --file deployment/deployment_challenger.yaml \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --workspace-name ${{ env.WORKSPACE_NAME }}

      - name: Router le trafic (80% Champion / 20% Challenger)
        run: |
          az ml online-endpoint update --name ${{ env.ENDPOINT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --workspace-name ${{ env.WORKSPACE_NAME }} \
            --traffic "champion=80 challenger=20"

  # -----------------------------------------------------------------
  # Étape 4 : Test de l'endpoint — vérifie que l'API répond bien (code 200)
  # et affiche plusieurs appels pour observer la répartition Champion/Challenger.
  # -----------------------------------------------------------------
  test-endpoint:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      AZURE_EXTENSION_DIR: /home/azureuser/.azure/cliextensions
    steps:
      - name: Récupérer l'URI de scoring et la clé de l'endpoint
        id: endpoint_info
        run: |
          SCORING_URI=$(az ml online-endpoint show --name ${{ env.ENDPOINT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --workspace-name ${{ env.WORKSPACE_NAME }} \
            --query scoring_uri -o tsv)
          KEY=$(az ml online-endpoint get-credentials --name ${{ env.ENDPOINT_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --workspace-name ${{ env.WORKSPACE_NAME }} \
            --query primaryKey -o tsv)
          echo "scoring_uri=$SCORING_URI" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Appeler l'endpoint avec une requête de test (vérifie le code 200)
        run: |
          PAYLOAD='{"data": [{"longitude": -122.23, "latitude": 37.88, "housing_median_age": 41, "total_rooms": 880, "total_bedrooms": 129, "population": 322, "households": 126, "median_income": 8.3}]}'

          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ steps.endpoint_info.outputs.scoring_uri }}" \
            -H "Authorization: Bearer ${{ steps.endpoint_info.outputs.key }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Code HTTP reçu : $HTTP_CODE"
          echo "Réponse :"
          cat response.json

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Échec : code HTTP $HTTP_CODE (attendu 200)"
            exit 1
          fi

      - name: Appeler l'endpoint plusieurs fois pour observer le partage de trafic
        run: |
          PAYLOAD='{"data": [{"longitude": -122.23, "latitude": 37.88, "housing_median_age": 41, "total_rooms": 880, "total_bedrooms": 129, "population": 322, "households": 126, "median_income": 8.3}]}'

          for i in $(seq 1 10); do
            RESPONSE=$(curl -s -X POST "${{ steps.endpoint_info.outputs.scoring_uri }}" \
              -H "Authorization: Bearer ${{ steps.endpoint_info.outputs.key }}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
            echo "Appel $i : $RESPONSE"
          done
